services:
  usermanagement-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__Path: /data/app.db
      Jwt__Authority: https://your-identity-provider.example.com
      Jwt__Audience: user-management-api
      Jwt__RequireHttpsMetadata: "true"
    volumes:
      - usermanagement-data:/data

volumes:
  usermanagement-data:
